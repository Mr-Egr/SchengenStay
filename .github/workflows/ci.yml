name: Project checks

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  checks:
    name: Checks (${{ matrix.os }})
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"
      - name: Install package and development tools
        run: python -m pip install -e ".[dev]"
      - name: Check dependencies
        run: python -m pip check
      - name: Lint
        run: ruff check .
      - name: Test
        run: python -m pytest -q
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
      - name: Frontend unit and static checks
        run: node --test tests/frontend/*.test.mjs
      - name: Browser Python source archive consistency
        run: python scripts/build_browser.py --check
      - name: Documentation links and examples
        run: python scripts/check_docs.py
      - name: Install pinned browser test tooling
        run: npm install --no-save --package-lock=false playwright@1.62.1
      - name: Install Chromium for browser checks
        run: npx playwright install --with-deps chromium
      - name: Browser interface and accessibility checks
        run: node tests/frontend/browser.mjs
      - name: Real Python browser integration and release journeys
        timeout-minutes: 15
        env:
          PYTHON_EXECUTABLE: python
        run: node tests/frontend/python-browser.mjs
